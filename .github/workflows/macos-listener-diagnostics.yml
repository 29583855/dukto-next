name: Native macOS listener and parallel exit diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install native Qt5 and OpenSSL
        shell: bash
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
      # 日期：2026-11-06；本轮只新增独立诊断，明确核对原失败生产/测试输入未改。
      - name: Verify unchanged R94 production and original tests
        shell: bash
        run: |
          git fetch --no-tags origin dec40621cce2d223e46b343e0d3d345a67b80523
          git diff --exit-code dec40621cce2d223e46b343e0d3d345a67b80523 -- src ui CMakeLists.txt tests/core_tests.cpp tests/file_exchange_tests.cpp
          mkdir -p evidence
          printf '%s\n' "$GITHUB_SHA" > evidence/diagnostic-commit.txt
          printf '%s\n' dec40621cce2d223e46b343e0d3d345a67b80523 > evidence/production-commit.txt
          sw_vers > evidence/environment.log
          uname -m >> evidence/environment.log
          qmake -query >> evidence/environment.log
      - name: Compile original targets and independent C++14 probe
        id: compile
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target core-tests file-exchange-tests --parallel 4
          cmake -S tests/listener_probe -B listener-build -DCMAKE_BUILD_TYPE=Release
          cmake --build listener-build --parallel 2
      - name: Record actual socket options and connection routes
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: listener-build/listener-probe > evidence/listener-probe.json
      # 日期：2026-11-06；三次独立进程保留原地址、断言和时限，任一次失败使该步骤失败。
      - name: Original exclusive binding and address family tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          status=0
          for attempt in 1 2 3; do
            build/core-tests exclusiveTcpBinding tcpAddressFamilies -o "evidence/core-$attempt.log,txt" -o "evidence/core-$attempt.xml,junitxml"
            code=$?
            echo "$attempt $code" >> evidence/core-exit-codes.txt
            if test "$code" -ne 0; then status=1; fi
          done
          exit "$status"
      # 日期：2026-11-06；退出超时原用例单独重复三次，不增加原10秒等待或删除晚期冲突场景。
      - name: Original download parallel disposition exit
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          status=0
          for attempt in 1 2 3; do
            build/file-exchange-tests parallelDispositions:download-4-2 -o "evidence/parallel-$attempt.log,txt" -o "evidence/parallel-$attempt.xml,junitxml"
            code=$?
            echo "$attempt $code" >> evidence/parallel-exit-codes.txt
            if test "$code" -ne 0; then status=1; fi
          done
          exit "$status"
      - name: Preserve original and native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-listener-diagnostics-${{ matrix.os }}
          path: evidence/**
