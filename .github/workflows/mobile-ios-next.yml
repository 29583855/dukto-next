name: Mobile complete iOS Next server UI validation
on:
  push:
    branches: [codex/mobile-platforms]
    paths: ['DuktoNextMobile/shared/**', 'DuktoNextMobile/app/**', 'DuktoNextMobile/tools/**', 'DuktoNextMobile/CMakeLists.txt', 'DuktoNextMobile/validation/ios_next.py', 'DuktoNextMobile/validation/ios-ui/NextServerTests.swift', '.github/workflows/mobile-ios-next.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-app:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record simulator toolchain
        run: |
          mkdir -p DuktoNextMobile/build-ios-simulator
          xcodebuild -version > DuktoNextMobile/build-ios-simulator/toolchain.txt
          xcrun --sdk iphonesimulator --show-sdk-version >> DuktoNextMobile/build-ios-simulator/toolchain.txt
          uname -m >> DuktoNextMobile/build-ios-simulator/toolchain.txt
          python -m pip install Pillow==11.3.0
          gem install --user-install xcodeproj --version 1.27.0 --no-document
      - uses: actions/cache/restore@v4
        id: simulator-cache
        with:
          path: ${{ runner.temp }}/dukto-ios-simulator/install
          key: mobile-ios-simulator-${{ runner.arch }}-${{ hashFiles('DuktoNextMobile/scripts/dependencies.json', 'DuktoNextMobile/validation/build_ios_simulator.py') }}
      - name: Build locked Qt and OpenSSL specifically for simulator
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        run: python -u -X utf8 DuktoNextMobile/validation/build_ios_simulator.py --phase dependencies --prefix "${{ runner.temp }}/dukto-ios-simulator/install" --work "${{ runner.temp }}/dukto-ios-simulator/dependencies"
      # 日期：2026-11-26；依赖完成即保存，应用阶段失败仍保留可复用的模拟器依赖缓存。
      - uses: actions/cache/save@v4
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dukto-ios-simulator/install
          key: ${{ steps.simulator-cache.outputs.cache-primary-key }}
      - name: Build complete production source app for simulator
        run: python -u -X utf8 DuktoNextMobile/validation/build_ios_simulator.py --phase application --prefix "${{ runner.temp }}/dukto-ios-simulator/install" --work DuktoNextMobile/build-ios-simulator
      - name: Build independent macOS Next TLS service from mobile core
        run: |
          brew install qt@5 openssl@3
          cmake -S DuktoNextMobile -B DuktoNextMobile/build-next-host -DDUKTO_MOBILE_HOST_CHECK=ON -DDUKTO_BUILD_GUI=OFF -DDUKTO_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build DuktoNextMobile/build-next-host --target dukto-mobile-probe --parallel 3
      - name: Exercise actual Next UI pairing browse download and upload
        run: python -u -X utf8 DuktoNextMobile/validation/ios_next.py --build DuktoNextMobile/build-ios-simulator --probe DuktoNextMobile/build-next-host/dukto-mobile-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-complete-ios-next-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            DuktoNextMobile/build-ios-simulator/*.json
            DuktoNextMobile/build-ios-simulator/*.txt
            DuktoNextMobile/build-ios-simulator/*.png
            DuktoNextMobile/build-ios-simulator/*.log
            DuktoNextMobile/build-ios-simulator/crash-*
            DuktoNextMobile/build-ios-simulator/*.jsonl
            DuktoNextMobile/build-ios-simulator/ios-next-*.xcresult/**
            ${{ runner.temp }}/dukto-ios-simulator/dependencies/*.log
            ${{ runner.temp }}/dukto-ios-simulator/dependencies/phase-receipt.json
