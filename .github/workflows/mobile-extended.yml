name: Mobile installed app and modern SDK validation
on:
  workflow_dispatch:
    inputs:
      apk_run:
        description: 原生APK成功构建run
        required: true
      apk_artifact:
        description: APK所在artifact名称；留空使用常规构建名称
        required: false
      apk_sha256:
        description: 已核对APK的SHA256
        required: true
      apk_source:
        description: APK源码提交
        required: true
      next_ui:
        description: 仅补测原始APK的Next服务器页面（配对、浏览、上传下载）
        type: boolean
        default: false
      ios:
        description: 同时验证完整iOS26构建
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  android-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build independent host Next service from mobile core
        if: inputs.next_ui
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libssl-dev qtbase5-dev qtbase5-private-dev qtdeclarative5-dev qtdeclarative5-private-dev qtquickcontrols2-5-dev qtquickcontrols2-5-private-dev
          cmake -S DuktoNextMobile -B DuktoNextMobile/build-next-probe -G Ninja -DDUKTO_MOBILE_HOST_CHECK=ON -DDUKTO_BUILD_GUI=OFF -DDUKTO_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build DuktoNextMobile/build-next-probe --target dukto-mobile-probe --parallel 3
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.apk_artifact || format('mobile-android-{0}', inputs.apk_run) }}
          run-id: ${{ inputs.apk_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mobile-original-apk
      - name: Locate the single original APK in the downloaded build artifact
        shell: python
        run: |
          # 日期：2026-11-25；兼容常规和源码重建目录，拒绝零个或多个APK。
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'mobile-original-apk'
          candidates = list(root.rglob('DuktoNextMobile-android-arm64-debug.apk'))
          if len(candidates) != 1 or candidates[0].is_symlink() or not candidates[0].is_file():
              raise SystemExit('Expected one regular original APK')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ORIGINAL_APK=' + str(candidates[0]) + '\n')
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python -m pip install Pillow==11.3.0
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_SHA256: ${{ inputs.apk_sha256 }}
          APK_SOURCE: ${{ inputs.apk_source }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python -X utf8 DuktoNextMobile/validation/android_emulator.py --apk "$ORIGINAL_APK" --output DuktoNextMobile/build-emulator --sha256 "$APK_SHA256" --source "$APK_SOURCE" --r6-send ${{ inputs.next_ui && '--next-server --probe DuktoNextMobile/build-next-probe/dukto-mobile-probe' || '--r6-receive --r6-file-send --r6-cold-file-send --saf-file-send --saf-file-export --saf-directory' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-startup-${{ github.run_id }}
          path: DuktoNextMobile/build-emulator/**
          if-no-files-found: warn
  ios-modern-sdk:
    if: inputs.ios
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select installed Xcode 26
        shell: python
        run: |
          import os, re, subprocess
          from pathlib import Path
          candidates = list(Path('/Applications').glob('Xcode_26*.app'))
          if not candidates:
              raise SystemExit('Xcode26 is not installed')
          selected = max(candidates, key=lambda p: tuple(int(n) for n in re.findall(r'\d+', p.name)))
          developer = str(selected / 'Contents/Developer')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DEVELOPER_DIR=' + developer + '\n')
          print(developer)
      - name: Record actual selected toolchain
        run: |
          mkdir -p DuktoNextMobile/build
          xcodebuild -version > DuktoNextMobile/build/toolchain.txt
          xcrun --sdk iphoneos --show-sdk-version >> DuktoNextMobile/build/toolchain.txt
          sw_vers >> DuktoNextMobile/build/toolchain.txt
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dukto-mobile/install
          key: mobile-ios-${{ runner.arch }}-${{ hashFiles('DuktoNextMobile/scripts/dependencies.json', 'DuktoNextMobile/scripts/build_dependencies.py') }}
          restore-keys: mobile-ios-${{ runner.arch }}-
      - name: Require reviewed source dependency cache
        id: ios-cache
        run: python -X utf8 DuktoNextMobile/scripts/validate_ios_cache.py --prefix "${{ runner.temp }}/dukto-mobile/install" --output "$GITHUB_OUTPUT"
      - name: Build complete app and extension with iOS 26 SDK
        env:
          CACHE_USABLE: ${{ steps.ios-cache.outputs.usable }}
        run: |
          test "$CACHE_USABLE" = true
          python -u -X utf8 DuktoNextMobile/scripts/build_app.py --platform ios --prefix "${{ runner.temp }}/dukto-mobile/install" --build DuktoNextMobile/build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-modern-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            DuktoNextMobile/build/toolchain.txt
            DuktoNextMobile/build/build-receipt.json
            DuktoNextMobile/build/packages/ios/**
