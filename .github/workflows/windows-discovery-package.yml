name: Windows discovery coexistence package
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-declarative
            mingw-w64-ucrt-x86_64-qt5-quickcontrols2
            mingw-w64-ucrt-x86_64-qt5-graphicaleffects
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-openssl
      - name: Select native toolchain
        shell: msys2 {0}
        run: |
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
          echo "DUKTO_QT_PREFIX=$(cygpath -m /ucrt64)" >> "$GITHUB_ENV"
      # 日期：2026-11-10；MSYS的Qt工具依赖会带入另一Python，验证固定使用setup-python的CPython。
      - run: '& "${{ steps.python.outputs.python-path }}" -m pip install psutil'
      - name: Configure C++14 application and tests
        run: cmake -S . -B build/windows-ucrt -G Ninja -DCMAKE_BUILD_TYPE=Release
      # 日期：2026-11-11；先加载真实页面并重复激活，QML集成失败立即停止。
      - name: Compile accessibility regression first
        run: cmake --build build/windows-ucrt --target quick-controls-tests --parallel 4
      - name: Validate production scrollbar activation and actions
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/windows-ucrt/quick-controls-tests.exe -o -,txt
      - name: Compile GUI CLI and tests
        run: cmake --build build/windows-ucrt --parallel 4
      # 日期：2026-11-11；使用生产文件选择器确认/取消后反复重开，防止上传之前再次堆损坏。
      - name: Validate upload file chooser lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/windows-ucrt/controller-tests.exe fileDialogCanCloseAndReopen -o -,txt -o build/file-dialog-lifecycle.xml,junitxml
      # 日期：2026-11-10；先在非回环IPv4上复现旧代理失败，并验证生产GUI的真实文件落盘。
      - name: Validate direct LAN transfers under proxies
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: build/windows-ucrt/controller-tests.exe fileTransferIgnoresProxy defaultPortConflictDoesNotSwitch customPortsHearStandardBroadcastAndEachOther -o -,txt -o build/proxy-regression.xml,junitxml
      # 日期：2026-11-10；保留全部核心与最终包迁移测试。
      - name: Validate full core and direct LAN transfers
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build/windows-ucrt --output-on-failure --output-log build/ctest.log
      - name: Deploy runtime DLLs and preserve source identity
        run: '& "${{ steps.python.outputs.python-path }}" -X utf8 scripts/package_windows.py --qt-prefix "$env:DUKTO_QT_PREFIX" --output package-output'
      - name: Validate relocated package on system PATH
        run: '& "${{ steps.python.outputs.python-path }}" -X utf8 tests/windows_package_integration.py package-output/DuktoNext-windows-x64-preview.zip --report build/package-runtime.json'
      - name: Preserve release and original validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-discovery-preview-X64
          path: |
            package-output/*.zip
            package-output/SHA256SUMS
            package-output/*.log
            build/*.xml
            build/*.json
            build/*.log
            build/windows-ucrt/Testing/QtTest/**
            build/windows-ucrt/Testing/Temporary/LastTest.log

  lifecycle-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Qt5 sanitizer test dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev qtbase5-dev qtbase5-private-dev qtdeclarative5-dev qtdeclarative5-private-dev qtquickcontrols2-5-dev qtquickcontrols2-5-private-dev libqt5sql5-sqlite
      # 日期：2026-11-11；地址消毒器独立证明旧析构顺序存在释放后访问，同一用例验证修复版。
      - name: Compare original and corrected chooser lifecycles
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          mkdir -p evidence
          cp src/app/boundedfiledialog.cpp evidence/fixed.cpp
          cp src/app/boundedfiledialog.h evidence/fixed.h
          git show 84765235df75a9c8731461d8d47bb65f83949104:src/app/boundedfiledialog.cpp > src/app/boundedfiledialog.cpp
          git show 84765235df75a9c8731461d8d47bb65f83949104:src/app/boundedfiledialog.h > src/app/boundedfiledialog.h
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build-asan --target controller-tests --parallel 3
          set +e
          build-asan/controller-tests fileDialogCanCloseAndReopen > evidence/original-lifecycle.log 2>&1
          original_code=$?
          set -e
          printf '%s\n' "$original_code" > evidence/original-exit-code.txt
          test "$original_code" -ne 0
          grep -q 'heap-use-after-free' evidence/original-lifecycle.log
          cp evidence/fixed.cpp src/app/boundedfiledialog.cpp
          cp evidence/fixed.h src/app/boundedfiledialog.h
          cmake --build build-asan --target controller-tests --parallel 3
          build-asan/controller-tests fileDialogCanCloseAndReopen -o evidence/fixed-lifecycle.log,txt -o evidence/fixed-lifecycle.xml,junitxml
      - name: Preserve original failure and fixed sanitizer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-dialog-lifecycle-sanitizer
          path: evidence/**
