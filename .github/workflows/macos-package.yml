name: Native macOS deployed preview packages
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture to build
        type: choice
        default: both
        options: [both, arm64, x86_64]
      discovery_probe:
        description: Only diagnose original UDP binding compatibility
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.architecture == 'arm64' && '["macos-15"]' || inputs.architecture == 'x86_64' && '["macos-15-intel"]' || '["macos-15", "macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil
      - name: Validate Mach-O compatibility gate
        run: |
          python -X utf8 tests/macos_compatibility_tests.py
          python -X utf8 tests/macos_dependency_load_tests.py
      # 日期：2026-11-09；源码依赖统一按macOS12编译，不能使用要求更高系统的Homebrew运行库。
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: ${{ runner.temp }}/dukto-macos12/install
          key: macos12-source-${{ runner.arch }}-${{ hashFiles('scripts/macos_dependencies.json', 'scripts/build_macos_dependencies.py') }}
      - name: Build Qt5 and OpenSSL for macOS 12
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: python -u -X utf8 scripts/build_macos_dependencies.py --prefix "$RUNNER_TEMP/dukto-macos12/install" --work dependency-build --jobs 3
      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dukto-macos12/install
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Select the source-built runtime
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/dukto-macos12/install"
          echo "CMAKE_PREFIX_PATH=$prefix/qt" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$prefix/openssl" >> "$GITHUB_ENV"
          echo "DUKTO_TEST_OPENSSL=$prefix/openssl/bin/openssl" >> "$GITHUB_ENV"
          echo "$prefix/qt/bin" >> "$GITHUB_PATH"
          echo "$prefix/openssl/bin" >> "$GITHUB_PATH"
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version
          sudo ifconfig lo0 alias 127.0.0.2
      - name: Configure C++14 application for macOS 12
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Diagnose original Qt UDP binding
        if: inputs.discovery_probe
        run: |
          cmake --build build --target discovery-binding-probe --parallel 3
          build/discovery-binding-probe > build/discovery-binding-probe.json
          cat build/discovery-binding-probe.json
      - name: Compile GUI, CLI and core tests
        if: ${{ !inputs.discovery_probe }}
        run: cmake --build build --parallel 3
      - name: Validate original UDP coexistence before full core
        if: ${{ !inputs.discovery_probe }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/controller-tests defaultPortConflictKeepsDiscoveryAndReceivesText customPortsHearStandardBroadcastAndEachOther twoDefaultInstancesDiscoverWithOriginalUDP explicitPortConflictDoesNotAdvertise -o -,txt -o build/discovery-coexistence.xml,junitxml
      - name: Validate full native core
        if: ${{ !inputs.discovery_probe }}
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build --output-on-failure
      - name: Validate Cocoa main window server navigation
        if: ${{ !inputs.discovery_probe }}
        run: python -X utf8 tests/main_window_navigation_integration.py build/ui-tests --platform cocoa --report build/main-window-navigation.json
      - name: Deploy macOS 12 preview and audit every native image
        if: ${{ !inputs.discovery_probe }}
        run: >-
          python -X utf8 scripts/package_macos.py --output package-output --minimum-macos 12.0
          --dependency-root "$RUNNER_TEMP/dukto-macos12/install/qt"
          --dependency-root "$RUNNER_TEMP/dukto-macos12/install/openssl"
          --dependency-manifest "$RUNNER_TEMP/dukto-macos12/install/dependency-manifest.json"
      - name: Validate relocated native preview
        if: ${{ !inputs.discovery_probe }}
        run: python -X utf8 tests/macos_package_integration.py "package-output/DuktoNext-macos-$(uname -m)-preview.tar.gz" --report build/package-runtime.json
      - name: Preserve package, failed logs and compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-preview-${{ runner.arch }}
          path: |
            package-output/*.tar.gz*
            package-output/*.log
            package-output/*.json
            dependency-build/*.log
            build/*.json
            build/*.xml
            build/*.log
            build/*.png
            build/main-window-navigation/**
            build/Testing/QtTest/**
            build/Testing/Temporary/LastTest.log
