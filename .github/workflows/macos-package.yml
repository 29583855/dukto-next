name: Native macOS deployed preview packages
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 日期：2026-11-05；Qt5和依赖由CI安装，部署后实际验证包内库来源及两种入口。
      - name: Install native build dependencies
        shell: bash
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          python -m pip install psutil
      - name: Configure C++14 application
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUKTO_BUILD_TESTS=OFF
      - name: Compile GUI and CLI
        run: cmake --build build --parallel 4
      - name: Deploy native preview
        id: deploy
        run: python -X utf8 scripts/package_macos.py --output package-output
      # 日期：2026-11-05；只用系统PATH迁移实际tar，失败不改成通过，原始归档与日志仍保存。
      - name: Validate relocated native preview
        shell: bash
        run: python -X utf8 tests/macos_package_integration.py "package-output/DuktoNext-macos-$(uname -m)-preview.tar.gz" --report build/package-runtime.json
      - name: Preserve package and deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-preview-${{ runner.arch }}
          path: |
            package-output/*.tar.gz*
            package-output/*.log
            build/*.json
            build/*.png
