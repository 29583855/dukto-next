name: Native idle maintenance and saturated transfer regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows Qt
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true
      - name: Install Linux Qt and TLS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev qtbase5-dev qtbase5-private-dev
      - name: Install macOS Qt and TLS
        if: runner.os == 'macOS'
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Install Windows TLS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci_tls_runtime.py
          "$PWD/.tools/openssl/Library/bin" >> $env:GITHUB_PATH
      - name: Install process sampler
        run: python -m pip install psutil
      # 日期：2026-11-09；只精简构建目标，生产C++14核心及原协议/资源断言均保持。
      - name: Configure native CLI
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUKTO_BUILD_GUI=OFF -DDUKTO_BUILD_TESTS=OFF
      - name: Compile native CLI
        run: cmake --build build --config Release --target dukto-cli --parallel 4
      - name: Exercise Windows saturated owners and real minute maintenance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -X utf8 tests/parallel_isolation_integration.py build/Release/dukto-cli.exe --report build/parallel-isolation.json
      - name: Exercise POSIX saturated owners and real minute maintenance
        if: runner.os != 'Windows'
        run: python -X utf8 tests/parallel_isolation_integration.py build/dukto-cli --report build/parallel-isolation.json
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-isolation-${{ matrix.os }}
          path: |
            build/parallel-isolation.json
            build/CMakeCache.txt
