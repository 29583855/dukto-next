name: Native macOS discovery original deadline diagnosis
on:
  workflow_dispatch:
jobs:
  discovery:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 日期：2026-11-05；旧失败源码独立检出和构建，不修改其输入或复用新二进制。
      - uses: actions/checkout@v4
        with:
          ref: 3b8bf4ac9459ec2a9caa3b74d9a63baf8c0e9ee7
          path: baseline-source
      - name: Install native Qt5 and OpenSSL
        shell: bash
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
      - name: Build separate baseline and current C++14 targets
        id: compile
        shell: bash
        run: |
          cmake -S baseline-source -B baseline-build -DCMAKE_BUILD_TYPE=Release
          cmake --build baseline-build --target core-tests --parallel 4
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target core-tests discovery-signature-probe --parallel 4
          printf '%s\n' "$GITHUB_SHA" > build/current-source-commit.txt
          git -C baseline-source rev-parse HEAD > build/baseline-source-commit.txt
          sw_vers > build/native-environment.txt
          uname -m >> build/native-environment.txt
      # 日期：2026-11-05；微基准只定位系统查询成本，不更改原 5000 包 / 10 秒测试。
      - name: Measure original synchronous hostname lookup cost
        run: build/discovery-signature-probe > build/discovery-signature-cost.json
      - name: Original baseline UDP deadline with native stack sample
        id: baseline
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          baseline-build/core-tests discoveryYieldsAndRejectsMalformedGoodbye -o build/baseline-chain.log,txt -o build/baseline-chain.xml,junitxml &
          probe_pid=$!
          if ! /usr/bin/sample "$probe_pid" 2 1 -file build/baseline-stack.log > build/baseline-sample-command.log 2>&1; then
            echo "Sampling unavailable or baseline already ended; original test outcome retained" >> build/baseline-sample-command.log
          fi
          wait "$probe_pid"
      # 日期：2026-11-05；基线失败不阻止新版独立验收；任一次原门槛失败仍使工作流失败。
      - name: Current UDP original deadline three independent processes
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          build/core-tests discoveryYieldsAndRejectsMalformedGoodbye -o build/current-chain-1.log,txt -o build/current-chain-1.xml,junitxml
          build/core-tests discoveryYieldsAndRejectsMalformedGoodbye -o build/current-chain-2.log,txt -o build/current-chain-2.xml,junitxml
          build/core-tests discoveryYieldsAndRejectsMalformedGoodbye -o build/current-chain-3.log,txt -o build/current-chain-3.xml,junitxml
      - name: Preserve all original and current diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-discovery-${{ matrix.os }}
          path: |
            build/*.json
            build/*.log
            build/*.xml
            build/*.txt
