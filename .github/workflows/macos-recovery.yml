name: Native macOS checkpoint and session regression
on:
  workflow_dispatch:
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 日期：2026-11-05；真实原生C++14构建，原业务速率和期限保持；仅缩小到前轮失败专项。
      - name: Install native build dependencies
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          python -m pip install psutil
      - name: Configure C++14 CLI
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUKTO_BUILD_GUI=OFF -DDUKTO_BUILD_TESTS=OFF
      - name: Compile application
        id: compile
        run: cmake --build build --parallel 4
      # 日期：2026-11-05；每个专项独立失败并保存真实证据，不让前一步失败阻断其他诊断。
      - name: Six default session expiry and recovery cases
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python -X utf8 tests/session_expiry_integration.py build/dukto-cli --report build/session-expiry.json
      - name: Fail policy checkpoint recovery
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python -X utf8 tests/transfer_recovery_integration.py build/dukto-cli --threads 4 --resume-threads 8 --files 4 --payload-mib 8 --checkpoint-percent 50 --on-conflict fail --report build/conflict-fail-recovery.json
      - name: Rename policy checkpoint recovery
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python -X utf8 tests/transfer_recovery_integration.py build/dukto-cli --threads 4 --resume-threads 8 --files 4 --payload-mib 8 --checkpoint-percent 50 --report build/parallel-recovery.json
      - name: Partial byte progress before pause
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python -X utf8 tests/byte_progress_integration.py build/dukto-cli --report build/byte-progress.json
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-recovery-${{ runner.arch }}
          path: |
            build/*.json
            build/*.log
