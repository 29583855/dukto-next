name: Native Mac server panel timing regression
on:
  workflow_dispatch:
jobs:
  panel:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 日期：2026-11-07；与失败原件相同的Qt5/C++14工具链，完整服务器面板专项独立执行。
      - name: Install native dependencies
        shell: bash
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Configure C++14 panel
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile actual server panel tests
        run: cmake --build build --target server-panel-tests --parallel 4
      # 日期：2026-11-07；两轮完整用例各自保存原件，任一失败仍使专项失败，不放宽原业务断言。
      - name: Validate two complete panel rounds
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          shasum -a 256 build/server-panel-tests > evidence/binary-before.sha256
          result=0
          for round in 1 2; do
            mkdir -p "evidence/round-$round"
            if ctest --test-dir build -R '^server-panel-tests$' --output-on-failure --output-log "$GITHUB_WORKSPACE/evidence/round-$round/ctest.log"; then
              code=0
            else
              code=$?
            fi
            printf '%s\n' "$code" > "evidence/round-$round/exit-code.txt"
            cp build/Testing/QtTest/server-panel-tests.log "evidence/round-$round/"
            cp build/Testing/QtTest/server-panel-tests.xml "evidence/round-$round/"
            if test "$code" -ne 0; then result=1; fi
          done
          shasum -a 256 build/server-panel-tests > evidence/binary-after.sha256
          cmp evidence/binary-before.sha256 evidence/binary-after.sha256 || result=1
          exit "$result"
      - name: Preserve actual panel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-panel-${{ runner.arch }}
          path: evidence/**
