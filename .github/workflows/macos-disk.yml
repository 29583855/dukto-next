name: Native macOS APFS disk exhaustion and recovery
on:
  workflow_dispatch:
jobs:
  disk:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify owned image cleanup state transitions
        run: python -m unittest discover -s tests -p macos_disk_cleanup_tests.py -v
      # 日期：2026-11-05；只在原生CI的独立磁盘镜像制造ENOSPC，不填充宿主系统卷。
      - name: Install native build dependencies
        shell: bash
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
      - name: Configure C++14 CLI
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUKTO_BUILD_TESTS=OFF
      - name: Compile independent CLI
        id: compile
        run: cmake --build build --target dukto-cli --parallel 4
      # 日期：2026-11-05；APFS需要大于tmpfs的最小镜像，精确容量由statvfs记录并传入专项，原Linux默认保持。
      - name: Original protocol APFS disk exhaustion
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          image="$RUNNER_TEMP/dukto-r6-limited.dmg"
          mount="$RUNNER_TEMP/dukto-r6-mount"
          test ! -e "$image"
          mkdir "$mount"
          hdiutil create -size 256m -fs APFS -volname Dukto-R6-Limited "$image"
          hdiutil attach -nobrowse -mountpoint "$mount" "$image"
          source scripts/ci_macos_disk_cleanup.sh
          trap 'dukto_macos_cleanup "$?" "$mount" "$image" "build/apfs-r6-cleanup.json"' EXIT
          diskutil info -plist "$mount" > build/apfs-r6-filesystem.log
          capacity=$(python -c 'import os,sys; s=os.statvfs(sys.argv[1]); print(s.f_blocks*s.f_frsize)' "$mount")
          python -X utf8 tests/disk_integration.py build/dukto-cli --limited-directory "$mount" --filesystem-bytes "$capacity" --report build/apfs-r6-disk.json
      - name: Four channel TLS APFS disk exhaustion and recovery
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          image="$RUNNER_TEMP/dukto-tls4-limited.dmg"
          mount="$RUNNER_TEMP/dukto-tls4-mount"
          test ! -e "$image"
          mkdir "$mount"
          hdiutil create -size 256m -fs APFS -volname Dukto-TLS4-Limited "$image"
          hdiutil attach -nobrowse -mountpoint "$mount" "$image"
          source scripts/ci_macos_disk_cleanup.sh
          trap 'dukto_macos_cleanup "$?" "$mount" "$image" "build/apfs-tls4-cleanup.json"' EXIT
          diskutil info -plist "$mount" > build/apfs-tls4-filesystem.log
          capacity=$(python -c 'import os,sys; s=os.statvfs(sys.argv[1]); print(s.f_blocks*s.f_frsize)' "$mount")
          python -X utf8 tests/parallel_disk_integration.py build/dukto-cli --limited-directory "$mount" --filesystem-bytes "$capacity" --threads 4 --report build/apfs-tls4-disk.json
      - name: Sixteen channel TLS APFS disk exhaustion and recovery
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          image="$RUNNER_TEMP/dukto-tls16-limited.dmg"
          mount="$RUNNER_TEMP/dukto-tls16-mount"
          test ! -e "$image"
          mkdir "$mount"
          hdiutil create -size 256m -fs APFS -volname Dukto-TLS16-Limited "$image"
          hdiutil attach -nobrowse -mountpoint "$mount" "$image"
          source scripts/ci_macos_disk_cleanup.sh
          trap 'dukto_macos_cleanup "$?" "$mount" "$image" "build/apfs-tls16-cleanup.json"' EXIT
          diskutil info -plist "$mount" > build/apfs-tls16-filesystem.log
          capacity=$(python -c 'import os,sys; s=os.statvfs(sys.argv[1]); print(s.f_blocks*s.f_frsize)' "$mount")
          python -X utf8 tests/parallel_disk_integration.py build/dukto-cli --limited-directory "$mount" --filesystem-bytes "$capacity" --threads 16 --report build/apfs-tls16-disk.json
      # 日期：2026-11-05；已有原件在中途ENOSPC前保持，释放空间恢复后原子覆盖；各并发档位独立APFS镜像。
      - name: Explicit overwrite APFS disk exhaustion and recovery
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          for channels in 1 4 16; do
            image="$RUNNER_TEMP/dukto-overwrite-$channels-limited.dmg"
            mount="$RUNNER_TEMP/dukto-overwrite-$channels-mount"
            test ! -e "$image"
            mkdir "$mount"
            hdiutil create -size 256m -fs APFS -volname "Dukto-Overwrite-$channels" "$image"
            hdiutil attach -nobrowse -mountpoint "$mount" "$image"
            source scripts/ci_macos_disk_cleanup.sh
            trap 'dukto_macos_cleanup "$?" "$mount" "$image" "build/apfs-overwrite-$channels-cleanup.json"' EXIT
            diskutil info -plist "$mount" > "build/apfs-overwrite-$channels-filesystem.log"
            capacity=$(python -c 'import os,sys; s=os.statvfs(sys.argv[1]); print(s.f_blocks*s.f_frsize)' "$mount")
            python -u -X utf8 tests/parallel_disk_integration.py build/dukto-cli --limited-directory "$mount" --filesystem-bytes "$capacity" --threads "$channels" --on-conflict overwrite --report "build/apfs-overwrite-$channels-disk.json"
            trap - EXIT
            dukto_macos_cleanup 0 "$mount" "$image" "build/apfs-overwrite-$channels-cleanup.json"
          done
      - name: Single channel default TLS APFS disk exhaustion and recovery
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          image="$RUNNER_TEMP/dukto-tls1-limited.dmg"
          mount="$RUNNER_TEMP/dukto-tls1-mount"
          test ! -e "$image"
          mkdir "$mount"
          hdiutil create -size 256m -fs APFS -volname Dukto-TLS1-Limited "$image"
          hdiutil attach -nobrowse -mountpoint "$mount" "$image"
          source scripts/ci_macos_disk_cleanup.sh
          trap 'dukto_macos_cleanup "$?" "$mount" "$image" "build/apfs-tls1-cleanup.json"' EXIT
          diskutil info -plist "$mount" > build/apfs-tls1-filesystem.log
          capacity=$(python -c 'import os,sys; s=os.statvfs(sys.argv[1]); print(s.f_blocks*s.f_frsize)' "$mount")
          python -u -X utf8 tests/parallel_disk_integration.py build/dukto-cli --limited-directory "$mount" --filesystem-bytes "$capacity" --threads 1 --report build/apfs-tls1-disk.json
      - name: Preserve APFS native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-apfs-${{ runner.arch }}
          path: |
            build/*.json
            build/*.log
