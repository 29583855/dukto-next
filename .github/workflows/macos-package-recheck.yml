name: Recheck an existing native macOS package
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Original macOS package workflow run ID
        required: true
        type: string
      package_source_commit:
        description: Exact 40-character source commit of the original package
        required: true
        type: string
      runner:
        description: Native architecture to recheck
        default: macos-15-intel
        required: true
        type: choice
        options: [macos-15-intel, macos-15]
permissions:
  actions: read
  contents: read
jobs:
  recheck:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil
      # 日期：2026-11-06；复查原始归档，不重新编译包；Actions下载校验附件摘要。
      - uses: actions/download-artifact@v4
        with:
          name: macos-preview-${{ runner.arch }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
          path: incoming
      # 日期：2026-11-06；原包源码与本次验证脚本提交分别记录，不能混用资格；输入只经环境传值。
      - name: Bind original package and current diagnostics
        env:
          PACKAGE_SOURCE: ${{ inputs.package_source_commit }}
          PACKAGE_RUN: ${{ inputs.package_run_id }}
        run: |
          python -X utf8 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import tarfile
          expected = os.environ['PACKAGE_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert re.fullmatch('[0-9]+', os.environ['PACKAGE_RUN'])
          archive = Path('incoming/package-output/DuktoNext-macos-' + platform.machine() + '-preview.tar.gz')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive.with_name(archive.name + '.sha256').read_text().split()[0] == digest
          with tarfile.open(archive) as source:
              manifests = [member for member in source.getmembers() if member.name.endswith('/package-manifest.json')]
              assert len(manifests) == 1 and manifests[0].size < 4 * 1024**2
              manifest = json.load(source.extractfile(manifests[0]))
          assert manifest['sourceCommit'] == expected and manifest['architecture'] == platform.machine()
          scripts = ['tests/macos_package_integration.py', 'tests/transfer_recovery_integration.py', 'tests/checkpoint_gate.py', 'tests/proxy_pacing.py']
          value = {'packageSourceCommit': expected, 'packageRunId': int(os.environ['PACKAGE_RUN']),
                   'diagnosticCommit': os.environ['GITHUB_SHA'], 'archiveSha256': digest,
                   'architecture': platform.machine(),
                   'scripts': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in scripts}}
          Path('build').mkdir(exist_ok=True)
          Path('build/recheck-inputs.json').write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(value))
          PY
      # 日期：2026-11-06；系统PATH迁移、全部五业务报告、50%真实检查点和90秒恢复预算保持。
      - name: Recheck original relocated package
        run: python -X utf8 tests/macos_package_integration.py "incoming/package-output/DuktoNext-macos-$(uname -m)-preview.tar.gz" --report build/package-runtime.json
      - name: Preserve every original outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-recheck-${{ runner.arch }}
          path: |
            build/*.json
            build/*.log
            build/*.png
