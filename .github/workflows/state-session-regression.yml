name: Native CLI state session lifecycle regression
on:
  workflow_dispatch:
jobs:
  session:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows Qt
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true
      - name: Install Linux Qt and TLS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qtbase5-private-dev libssl-dev libqt5sql5-sqlite
      - name: Install macOS Qt and TLS
        if: runner.os == 'macOS'
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
      - name: Install Windows TLS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci_tls_runtime.py
          "$PWD/.tools/openssl/Library/bin" >> $env:GITHUB_PATH
      # 日期：2026-11-08；本工作流只授予CLI根生命周期与真实进程专项，完整GUI/核心/协议继续由独立完整工作流验证。
      - name: Configure actual C++14 CLI and state session tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUKTO_BUILD_GUI=OFF
      - name: Compile actual CLI and bound state sessions
        run: cmake --build build --config Release --target dukto-cli state-session-tests --parallel 4
      - name: Verify state session and CLI lifecycle boundaries
        run: python -X utf8 scripts/ci_state_session.py --build build --configuration Release
      - name: Preserve original state session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-session-${{ matrix.os }}
          path: |
            build/state-session-regression/**
            build/Testing/**
            build/CMakeCache.txt
