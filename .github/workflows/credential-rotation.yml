name: Native credential rotation stop diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-rotation:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 日期：2026-11-06；真实原生C++14/Qt5生产CLI，诊断不改变故障速率或原15秒停止期限。
      - name: Install native Qt5 and OpenSSL
        shell: bash
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          python -m pip install psutil
      - name: Configure C++14 independent CLI
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUKTO_BUILD_GUI=OFF -DDUKTO_BUILD_TESTS=OFF
      - name: Compile original production CLI
        id: compile
        run: cmake --build build --parallel 4 --target dukto-cli
      - name: Real credential rotation and active transfer stop original assertions
        if: "!cancelled() && steps.compile.outcome == 'success'"
        run: python -X utf8 -u tests/credential_rotation_integration.py build/dukto-cli --report build/credential-rotation.json
      - name: Preserve exact input identities
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > build/source-commit.txt
          shasum -a 256 build/dukto-cli tests/credential_rotation_integration.py > build/source-and-binary.sha256
      - name: Preserve rotation stop original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-rotation-${{ matrix.os }}
          path: |
            build/credential-rotation.json
            build/source-commit.txt
            build/source-and-binary.sha256
