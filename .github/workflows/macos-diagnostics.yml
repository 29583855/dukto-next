name: Native macOS session and discovery diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 日期：2026-11-05；独立原生诊断仅缩小测试范围，保持生产构建及会话/UDP原门槛。
      - name: Install native Qt5 and OpenSSL
        shell: bash
        run: |
          brew install qt@5 openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "DUKTO_TEST_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      # 日期：2026-11-05；真实TCP注入70ms超睡，独立验证代理速率/取消后再执行业务专项。
      - name: Validate bounded proxy pacing
        run: python -X utf8 tests/proxy_pacing_integration.py --report proxy-pacing.json
      - name: Configure C++14
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile diagnostic targets
        id: compile
        run: cmake --build build --target dukto-cli core-tests --parallel 4
      - name: Record native environment
        shell: bash
        run: |
          {
            sw_vers
            uname -m
            clang++ --version
            qmake -query
            openssl version -a
          } > build/macos-diagnostic-environment.log 2>&1
          printf '%s\n' "$GITHUB_SHA" > build/diagnostic-source-commit.log
      - name: Original UDP chain limit
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: build/core-tests discoveryYieldsAndRejectsMalformedGoodbye -o build/discovery-chain.log,txt -o build/discovery-chain.xml,junitxml
      # 日期：2026-11-05；两个方向独立诊断，保持原20秒/512KiB/s/90秒门槛。
      - name: Single channel upload session original limits
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python -X utf8 tests/session_expiry_integration.py build/dukto-cli --channels 1 --directions upload --report build/session-expiry-upload.json
      - name: Single channel download session original limits
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python -X utf8 tests/session_expiry_integration.py build/dukto-cli --channels 1 --directions download --report build/session-expiry-download.json
      - name: Preserve native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-diagnostics-${{ matrix.os }}
          path: |
            proxy-pacing.json
            build/*.log
            build/*.json
            build/*.xml
