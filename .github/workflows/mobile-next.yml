name: Mobile Android Next server UI validation
on:
  workflow_dispatch:
    inputs:
      apk_run:
        description: 已验包原始APK构建run
        required: true
      apk_artifact:
        description: 原始APK的artifact名称
        required: true
      apk_sha256:
        description: 原始APK的SHA256
        required: true
      apk_source:
        description: 原始APK源码提交
        required: true
permissions:
  contents: read
  actions: read
jobs:
  android-next-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build independent host Next service from mobile core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libssl-dev qtbase5-dev qtbase5-private-dev qtdeclarative5-dev qtdeclarative5-private-dev qtquickcontrols2-5-dev qtquickcontrols2-5-private-dev
          cmake -S DuktoNextMobile -B DuktoNextMobile/build-next-probe -G Ninja -DDUKTO_MOBILE_HOST_CHECK=ON -DDUKTO_BUILD_GUI=OFF -DDUKTO_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build DuktoNextMobile/build-next-probe --target dukto-mobile-probe --parallel 3
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.apk_artifact }}
          run-id: ${{ inputs.apk_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mobile-original-apk
      - name: Locate single original APK
        shell: python
        run: |
          # 日期：2026-11-26；拒绝零个、多份或链接APK，应用摘要由运行脚本再次检查。
          import os
          from pathlib import Path
          candidates = list((Path(os.environ['RUNNER_TEMP']) / 'mobile-original-apk').rglob('DuktoNextMobile-android-arm64-debug.apk'))
          if len(candidates) != 1 or candidates[0].is_symlink() or not candidates[0].is_file():
              raise SystemExit('Expected one regular original APK')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ORIGINAL_APK=' + str(candidates[0]) + '\n')
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python -m pip install Pillow==11.3.0
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_SHA256: ${{ inputs.apk_sha256 }}
          APK_SOURCE: ${{ inputs.apk_source }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python -X utf8 DuktoNextMobile/validation/android_emulator.py --apk "$ORIGINAL_APK" --output DuktoNextMobile/build-next-ui --sha256 "$APK_SHA256" --source "$APK_SOURCE" --r6-send --next-server --probe DuktoNextMobile/build-next-probe/dukto-mobile-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-next-ui-${{ github.run_id }}
          path: DuktoNextMobile/build-next-ui/**
          if-no-files-found: warn
