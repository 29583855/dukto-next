name: Mobile storage regression
on:
  push:
    branches: [codex/mobile-platforms]
    paths: ['DuktoNextMobile/tests/**', 'DuktoNextMobile/app/**', 'DuktoNextMobile/shared/**', 'DuktoNextMobile/tools/**', 'DuktoNextMobile/scripts/**', 'DuktoNextMobile/platform/android/**', 'DuktoNextMobile/platform/ios/**', 'DuktoNextMobile/CMakeLists.txt', '.github/workflows/mobile-storage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y qtbase5-dev ninja-build
      - name: Test package inspection boundaries
        run: python -m unittest discover -s DuktoNextMobile/scripts -p '*_tests.py' -v
      - name: Compile and exercise import transactions
        run: |
          cmake -S DuktoNextMobile/tests -B DuktoNextMobile/build-storage -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build DuktoNextMobile/build-storage
          DUKTO_TEST_LARGE_IMPORT=1 ctest --test-dir DuktoNextMobile/build-storage --verbose

  host-ui-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host compile and render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libssl-dev qtbase5-dev qtbase5-private-dev qtdeclarative5-dev qtdeclarative5-private-dev qtquickcontrols2-5-dev qtquickcontrols2-5-private-dev qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick2 qml-module-qtgraphicaleffects fonts-noto-cjk xvfb
      - name: Compile real mobile controllers under C++14
        run: |
          cmake -S DuktoNextMobile -B DuktoNextMobile/build-host -G Ninja -DDUKTO_MOBILE_HOST_CHECK=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build DuktoNextMobile/build-host --parallel 3
      - name: Exercise real mobile core over loopback sockets
        run: |
          python DuktoNextMobile/tests/interop/legacy_integration.py DuktoNextMobile/build-host/dukto-mobile-probe --report mobile-legacy.json
          python DuktoNextMobile/tests/interop/service_integration.py DuktoNextMobile/build-host/dukto-mobile-probe --report mobile-service.json
          for lanes in 1 2 4 8 16; do
            python DuktoNextMobile/tests/interop/transfer_integration.py DuktoNextMobile/build-host/dukto-mobile-probe --threads "$lanes" --report "mobile-next-${lanes}.json"
          done
      - name: Render actual QML with isolated user data
        env:
          QT_QUICK_BACKEND: software
          XDG_DATA_HOME: ${{ runner.temp }}/mobile-host-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/mobile-host-config
        run: timeout 60s xvfb-run -a DuktoNextMobile/build-host/dukto-mobile-host --smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-host-render-${{ github.run_id }}
          path: |
            mobile-smoke-*.png
            mobile-*.json
          if-no-files-found: ignore

  android-java-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Test actual Android share and foreground service contracts
        run: gradle -p DuktoNextMobile/tests/android testDebugUnitTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-contract-${{ github.run_id }}
          path: |
            DuktoNextMobile/tests/android/build/test-results/**/*.xml
            DuktoNextMobile/tests/android/build/reports/tests/**
          if-no-files-found: warn

  ios-inbox-contract:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real native iOS share inbox on macOS
        run: |
          mkdir -p DuktoNextMobile/build-inbox
          clang++ -std=c++14 -fobjc-arc -framework Foundation -I DuktoNextMobile/platform/ios/share DuktoNextMobile/platform/ios/share/Inbox.mm DuktoNextMobile/tests/ios/inbox_tests.mm -o DuktoNextMobile/build-inbox/inbox-tests
          DuktoNextMobile/build-inbox/inbox-tests
